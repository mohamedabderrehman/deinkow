<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>دخول - Deinkow</title>
    <meta name="description" content="سجل دخولك إلى Deinkow لإدارة مشاريعك البرمجية">
    <link rel="icon" type="image/png" href="favicon.ico">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <!-- Google reCAPTCHA v2 Checkbox -->
    <script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>
    <script>
        // Callback function for reCAPTCHA
        function onRecaptchaLoad() {
            console.log('reCAPTCHA script loaded');
            // Render reCAPTCHA widget
            if (typeof grecaptcha !== 'undefined') {
                const recaptchaContainer = document.getElementById('recaptcha-container');
                if (recaptchaContainer) {
                    try {
                        grecaptcha.render(recaptchaContainer, {
                            'sitekey': '6LdiM0ksAAAAAPsZ5NEZEmthOJK-MA5c6upq9uhM',
                            'callback': function(token) {
                                console.log('reCAPTCHA verified:', token);
                                const errorDiv = document.getElementById('recaptcha-error');
                                if (errorDiv) errorDiv.style.display = 'none';
                            },
                            'expired-callback': function() {
                                console.log('reCAPTCHA expired');
                                Toast.warning('انتهت صلاحية reCAPTCHA. يرجى إعادة التحقق.');
                            },
                            'error-callback': function() {
                                console.error('reCAPTCHA error');
                                const errorDiv = document.getElementById('recaptcha-error');
                                if (errorDiv) {
                                    errorDiv.textContent = '⚠️ حدث خطأ في reCAPTCHA. يرجى تحديث الصفحة.';
                                    errorDiv.style.display = 'block';
                                }
                                Toast.error('حدث خطأ في reCAPTCHA. يرجى تحديث الصفحة.');
                            }
                        });
                        console.log('reCAPTCHA widget rendered successfully');
                    } catch (error) {
                        console.error('Error rendering reCAPTCHA:', error);
                        const errorDiv = document.getElementById('recaptcha-error');
                        if (errorDiv) {
                            errorDiv.textContent = '⚠️ فشل تحميل reCAPTCHA. يرجى التحقق من Domain في Google reCAPTCHA Console.';
                            errorDiv.style.display = 'block';
                        }
                    }
                } else {
                    console.error('reCAPTCHA container not found');
                }
            } else {
                console.error('grecaptcha is not defined');
                const errorDiv = document.getElementById('recaptcha-error');
                if (errorDiv) {
                    errorDiv.textContent = '⚠️ فشل تحميل reCAPTCHA script. يرجى التحقق من اتصال الإنترنت.';
                    errorDiv.style.display = 'block';
                }
            }
        }
        
        // Fallback: Check if reCAPTCHA loaded after 5 seconds
        window.addEventListener('load', function() {
            setTimeout(function() {
                const recaptchaContainer = document.getElementById('recaptcha-container');
                if (recaptchaContainer) {
                    const hasIframe = recaptchaContainer.querySelector('iframe');
                    if (typeof grecaptcha === 'undefined' || !hasIframe) {
                        console.error('reCAPTCHA failed to load after 5 seconds');
                        const errorDiv = document.getElementById('recaptcha-error');
                        if (errorDiv) {
                            errorDiv.innerHTML = '⚠️ فشل تحميل reCAPTCHA. يرجى التحقق من:<br>1. اتصال الإنترنت<br>2. Domain مسجل في <a href="https://www.google.com/recaptcha/admin" target="_blank">Google reCAPTCHA Console</a><br>3. تحديث الصفحة';
                            errorDiv.style.display = 'block';
                        }
                    }
                }
            }, 5000);
        });
    </script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/Home" class="logo">
                    <img src="logo.png" alt="Deinkow Logo" class="logo-image">
                </a>
                <nav class="nav">
                    <a href="https://t.me/Deinkow" target="_blank" rel="noopener noreferrer" class="nav-link telegram-link" aria-label="Telegram Channel">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM16.64 8.8C16.49 10.38 15.84 14.22 15.51 15.99C15.37 16.74 15.09 16.99 14.83 17.02C14.25 17.07 13.81 16.64 13.25 16.27C12.37 15.69 11.87 15.33 11.02 14.77C10.03 14.12 10.67 13.76 11.24 13.18C11.39 13.03 13.95 10.7 14 10.49C14.0077 10.4582 14.0077 10.4246 14 10.393C13.97 10.29 13.89 10.23 13.8 10.18C13.68 10.12 13.55 10.15 13.44 10.18C13.28 10.24 11.95 11.16 9.4 12.61C8.89 12.88 8.42 13.02 8 13.02C7.54 13.02 6.63 12.8 5.95 12.61C5.25 12.41 4.68 12.3 4.73 11.94C4.75 11.79 5.01 11.63 5.5 11.45C8.11 10.44 10.25 9.65 11.93 9.08C14.49 8.2 15.25 7.95 15.54 7.95C15.63 7.95 15.83 7.98 15.96 8.09C16.07 8.18 16.1 8.3 16.11 8.38C16.12 8.46 16.14 8.63 16.13 8.79L16.64 8.8Z" fill="currentColor"/>
                        </svg>
                        Telegram
                    </a>
                    <a href="/Login" class="btn btn-secondary">دخول</a>
                    <a href="/Register" class="btn btn-primary">اطلب مشروعك الآن</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Sign In Section -->
    <section class="signin-section">
        <div class="container">
            <div class="signin-container">
                <div class="signin-card">
                    <div class="signin-header">
                        <h1 class="signin-title">دخول</h1>
                        <p class="signin-subtitle">مرحباً بك في Deinkow</p>
                    </div>
                    
                    <form class="signin-form" id="signinForm">
                        <div class="form-group">
                            <label for="emailOrUsername" class="form-label">البريد الإلكتروني أو اسم المستخدم</label>
                            <input 
                                type="text" 
                                id="emailOrUsername" 
                                name="emailOrUsername" 
                                class="form-input" 
                                placeholder="أدخل بريدك الإلكتروني أو اسم المستخدم"
                                required
                                autocomplete="username"
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <div class="password-input-wrapper">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    class="form-input" 
                                    placeholder="أدخل كلمة المرور"
                                    required
                                    autocomplete="current-password"
                                >
                                <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" class="eye-icon">
                                        <path d="M10 4C6 4 3.27 6.11 2 9C3.27 11.89 6 14 10 14C14 14 16.73 11.89 18 9C16.73 6.11 14 4 10 4Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                        <circle cx="10" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                    </svg>
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" class="eye-off-icon" style="display: none;">
                                        <path d="M2 2L18 18M8.88 8.88A3 3 0 0 0 10 12C11.1046 12 12 11.1046 12 10M14.12 14.12C13.38 14.63 12.54 15 11.64 15.19M6.5 4.71C4.07 5.91 2.42 7.67 1.42 9C2.42 10.33 4.07 12.09 6.5 13.29M13.5 15.29C15.93 14.09 17.58 12.33 18.58 11C17.58 9.67 15.93 7.91 13.5 6.71" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="rememberMe" name="rememberMe" class="checkbox-input">
                                <span class="checkbox-text">تذكرني</span>
                            </label>
                            <a href="#" class="forgot-password">نسيت كلمة المرور؟</a>
                        </div>
                        
                        <div class="form-group" style="border: none !important; outline: none !important;">
                            <div class="g-recaptcha" id="recaptcha-container" style="border: none !important; outline: none !important;"></div>
                            <div id="recaptcha-error" style="display: none; margin-top: 10px; padding: 10px; background: #fee; border: none !important; border-radius: 4px; color: #c33;"></div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block btn-large">
                            دخول
                        </button>
                    </form>
                    
                    <div class="signin-footer">
                        <p class="signin-footer-text">
                            ما عندكش حساب؟ 
                            <a href="/Register" class="signin-footer-link">سجل الآن</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Password toggle functionality
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        const eyeIcon = passwordToggle.querySelector('.eye-icon');
        const eyeOffIcon = passwordToggle.querySelector('.eye-off-icon');

        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
            } else {
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
            }
        });

        // Form submission
        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Sanitize inputs
            const emailOrUsername = InputSanitizer.sanitize(document.getElementById('emailOrUsername').value.trim());
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            if (!emailOrUsername || !password) {
                Toast.error('يرجى ملء جميع الحقول المطلوبة');
                return;
            }
            
            const submitButton = e.target.querySelector('button[type="submit"]');
            const form = e.target;
            const originalText = submitButton.textContent;
            
            submitButton.disabled = true;
            submitButton.textContent = 'جاري تسجيل الدخول...';
            
            // Show loading spinner
            const spinner = LoadingSpinner.show(form);
            
            try {
                // Get reCAPTCHA token (v2 Checkbox)
                let recaptchaToken = '';
                try {
                    if (typeof grecaptcha !== 'undefined') {
                        recaptchaToken = grecaptcha.getResponse();
                        if (!recaptchaToken) {
                            Toast.error('يرجى إكمال التحقق من reCAPTCHA');
                            LoadingSpinner.hide(form);
                            submitButton.disabled = false;
                            submitButton.textContent = originalText;
                            return;
                        }
                    } else {
                        Toast.error('reCAPTCHA failed to load. Please refresh the page and try again.');
                        LoadingSpinner.hide(form);
                        submitButton.disabled = false;
                        submitButton.textContent = originalText;
                        return;
                    }
                } catch (recaptchaError) {
                    Logger.error('reCAPTCHA error:', recaptchaError);
                    Toast.error('reCAPTCHA verification failed. Please try again.');
                    LoadingSpinner.hide(form);
                    submitButton.disabled = false;
                    submitButton.textContent = originalText;
                    return;
                }
                
                const response = await API.auth.login(emailOrUsername, password, rememberMe, recaptchaToken);
                
                if (response.success) {
                    // API.auth.login() automatically saves the token, but let's verify
                    await new Promise(resolve => setTimeout(resolve, 100));
                    const token = localStorage.getItem('authToken');
                    Logger.log('Token saved after login:', !!token);
                    Logger.log('Token value (first 30 chars):', token ? token.substring(0, 30) + '...' : 'null');
                    
                    if (!token) {
                        LoadingSpinner.hide(form);
                        Toast.error('Failed to save authentication token. Please try again.');
                        if (typeof grecaptcha !== 'undefined') {
                            grecaptcha.reset();
                        }
                        submitButton.disabled = false;
                        submitButton.textContent = originalText;
                        return;
                    }
                    
                    Toast.success('تم تسجيل الدخول بنجاح! جاري التوجيه...');
                    
                    // Wait longer to ensure token is fully saved and persisted
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    // Verify token is still there before redirect
                    const finalTokenCheck = localStorage.getItem('authToken');
                    if (!finalTokenCheck) {
                        LoadingSpinner.hide(form);
                        Toast.error('Authentication token was lost. Please try logging in again.');
                        if (typeof grecaptcha !== 'undefined') {
                            grecaptcha.reset();
                        }
                        submitButton.disabled = false;
                        submitButton.textContent = originalText;
                        return;
                    }
                    
                    // Redirect to dashboard
                    window.location.href = '/Dashboard';
                } else {
                    LoadingSpinner.hide(form);
                    Toast.error(response.message || 'فشل تسجيل الدخول. يرجى التحقق من بياناتك.');
                    // Reset reCAPTCHA on error
                    if (typeof grecaptcha !== 'undefined') {
                        grecaptcha.reset();
                    }
                    submitButton.disabled = false;
                    submitButton.textContent = originalText;
                }
            } catch (error) {
                LoadingSpinner.hide(form);
                ErrorHandler.handle(error, 'Sign In');
                // Reset reCAPTCHA on error
                if (typeof grecaptcha !== 'undefined') {
                    grecaptcha.reset();
                }
                submitButton.disabled = false;
                submitButton.textContent = originalText;
            }
        });
    </script>
</body>
</html>
